services:
  sub-service:
    build: .
    container_name: sub-service
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./storage:/app/storage
      - /var/www/vpn-keys:/var/www/vpn-keys
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
